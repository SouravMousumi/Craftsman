<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#142e20"/>
      <stop offset="100%" stopColor="#08140d"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b"/>
      <stop offset="100%" stopColor="#b45309"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#4ade80"/>
      <stop offset="100%" stopColor="#15803d"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f1f5f9"/>
      <stop offset="100%" stopColor="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with gold border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Timber log tree rings motif in background -->
  <circle cx="256" cy="270" r="170" fill="none" stroke="#d97706" stroke-width="3" opacity="0.15"/>
  <circle cx="256" cy="270" r="130" fill="none" stroke="#d97706" stroke-width="3" opacity="0.2"/>
  <circle cx="256" cy="270" r="90" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.25"/>

  <!-- Pine Tree layered canopy -->
  <!-- Tree trunk -->
  <path d="M 240 330 L 235 410 C 235 418 277 418 277 410 L 272 330 Z" fill="#78350f" stroke="#451a03" stroke-width="4"/>
  <!-- Canopy tiers -->
  <path d="M 256 190 L 370 340 C 360 348 152 348 142 340 Z" fill="#166534"/>
  <path d="M 256 130 L 340 250 C 330 256 182 256 172 250 Z" fill="#15803d"/>
  <path d="M 256 70 L 310 170 C 300 176 212 176 202 170 Z" fill="url(#treeGrad)"/>

  <!-- Golden Axe crossing over -->
  <g transform="translate(180, 160) rotate(32)">
    <!-- Axe handle -->
    <rect x="52" y="40" width="16" height="230" rx="6" fill="#92400e" stroke="#451a03" stroke-width="3"/>
    <rect x="50" y="210" width="20" height="50" rx="4" fill="#78350f"/>
    <!-- Axe head blade -->
    <path d="M 68 50 C 85 40 120 30 140 10 C 130 60 130 110 140 160 C 120 140 85 130 68 120 Z" fill="url(#bladeGrad)" stroke="#475569" stroke-width="3"/>
    <!-- Golden engraving on blade -->
    <circle cx="95" cy="85" r="10" fill="#f59e0b"/>
  </g>

  <!-- Sparkles -->
  <polygon points="380,120 385,135 400,140 385,145 380,160 375,145 360,140 375,135" fill="#facc15"/>
  <polygon points="120,200 123,210 135,213 123,217 120,228 117,217 105,213 117,210" fill="#fde047"/>
</svg>
